name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache ffmpeg-kit AAR (~80 MB)
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2/files-2.1/com.arthenica
          key: ffmpegkit-full-gpl-6.0-2-LTS

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Show APK size
        run: |
          ls -lh app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/app-debug.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dmd-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
